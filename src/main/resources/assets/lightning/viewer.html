<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lightning report</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1b1f24; --muted: #5d6673; --line: #dfe3e8; --soft: #eef1f4;
  --accent: #c27c00; --accent-ink: #7a4d00; --high: #c0362c; --medium: #b86e00; --low: #3d6fb6; --info: #5d6673;
  --gpu: #7b4fd6; --sel: #fff1cc; --mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418; --panel: #191d22; --ink: #e6e9ed; --muted: #98a2ae; --line: #2b3138; --soft: #20252b;
    --accent: #f0a91a; --accent-ink: #ffd27a; --high: #ff6b5e; --medium: #f0a52a; --low: #74a7f2; --info: #98a2ae;
    --gpu: #b28cff; --sel: #3a3020; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --panel: #191d22; --ink: #e6e9ed; --muted: #98a2ae; --line: #2b3138; --soft: #20252b;
  --accent: #f0a91a; --accent-ink: #ffd27a; --high: #ff6b5e; --medium: #f0a52a; --low: #74a7f2; --info: #98a2ae;
  --gpu: #b28cff; --sel: #3a3020; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; display: flex; align-items: center; gap: 8px; }
header h1 .bolt { color: var(--accent); font-size: 20px; }
header .meta { color: var(--muted); font-size: 13px; }
nav { display: flex; gap: 2px; flex-wrap: wrap; margin-left: auto; }
nav button { background: none; border: 0; color: var(--muted); padding: 6px 10px; border-radius: 6px; cursor: pointer; font: inherit; }
nav button:hover { background: var(--soft); color: var(--ink); }
nav button.on { background: var(--soft); color: var(--ink); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
main { padding: 16px 20px 60px; max-width: 1500px; margin: 0 auto; }
section.tab { display: none; }
section.tab.on { display: block; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
.card h2 { font-size: 15px; margin: 0 0 10px; }
.card h3 { font-size: 13px; margin: 14px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.hint { color: var(--muted); font-size: 12.5px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.kpi .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--muted); font-size: 12px; }
.contenders { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; margin-bottom: 16px; }
.contender { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.contender .rank { color: var(--muted); font-size: 12px; font-weight: 600; }
.contender .ct { font-size: 16px; font-weight: 650; line-height: 1.3; }
.contender .cs { font-size: 14px; color: var(--accent-ink); font-weight: 600; }
.contender .cw { font-size: 13.5px; }
.contender .ctry { font-size: 13px; color: var(--muted); }
.contender a { color: var(--accent-ink); cursor: pointer; font-size: 13px; font-weight: 600; margin-top: auto; }
.lead { font-size: 15px; margin: 4px 0 14px; color: var(--muted); }
.finding { display: grid; grid-template-columns: 70px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.finding:first-of-type { border-top: 0; }
.sev { font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; text-align: center; align-self: start; color: #fff; }
.sev.high { background: var(--high); } .sev.medium { background: var(--medium); } .sev.low { background: var(--low); } .sev.info { background: var(--info); }
.finding .t { font-weight: 600; } .finding .b { color: var(--muted); font-size: 12px; margin-top: 3px; }
.finding a { color: var(--accent-ink); cursor: pointer; font-size: 12.5px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; font-size: 12px; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--panel); }
th:first-child, td:first-child { text-align: left; }
td.name { white-space: normal; word-break: break-word; font-family: var(--mono); font-size: 12.5px; }
tr.sel td { background: var(--sel); }
tbody tr:hover td { background: var(--soft); cursor: default; }
.scroll { max-height: 560px; overflow: auto; }
.twist { display: inline-block; width: 14px; color: var(--muted); cursor: pointer; }
.bar { display: inline-block; height: 8px; background: var(--accent); border-radius: 2px; vertical-align: middle; opacity: .8; }
.gpuc { color: var(--gpu); }
.row { display: flex; gap: 14px; flex-wrap: wrap; }
.row > .card { flex: 1 1 420px; min-width: 0; }
select, input[type=search] { font: inherit; padding: 4px 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; }
.controls { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
canvas { width: 100%; display: block; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
#tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 12px; max-width: 520px; box-shadow: 0 4px 16px rgba(0,0,0,.18); display: none; z-index: 20; white-space: pre-wrap; }
pre.md { white-space: pre-wrap; font-family: var(--mono); font-size: 12.5px; background: var(--soft); padding: 12px; border-radius: 8px; max-height: 70vh; overflow: auto; }
.pill { display: inline-block; padding: 1px 6px; border-radius: 10px; background: var(--soft); font-size: 11.5px; color: var(--muted); margin-left: 6px; }
.btn { font: inherit; padding: 5px 10px; border: 1px solid var(--line); background: var(--soft); color: var(--ink); border-radius: 6px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
#drop { text-align: center; padding: 80px 20px; color: var(--muted); }
#drop.hot { background: var(--sel); }
.empty { color: var(--muted); padding: 12px 0; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; font-size: 13px; }
.kv div:nth-child(odd) { color: var(--muted); }
.spikes { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.spikes button { font: 12px var(--mono); padding: 3px 7px; border: 1px solid var(--line); background: var(--soft); color: var(--ink); border-radius: 5px; cursor: pointer; }
.spikes button.on { border-color: var(--accent); background: var(--sel); }
@media (max-width: 700px) { main { padding: 12px; } header { padding: 10px 12px; } th, td { padding: 3px 5px; } }
</style>
</head>
<body>
<header>
  <h1><span class="bolt">⚡</span> Lightning <span class="meta" id="hdr"></span></h1>
  <nav id="nav"></nav>
</header>
<main id="main">
  <div id="drop">Loading…</div>
</main>
<div id="tip"></div>
<script id="lightning-data" type="application/octet-stream">__LIGHTNING_DATA__</script>
<script>
"use strict";
// ---------------------------------------------------------------------------------------------
// Loading: embedded gzip+base64 data, or a .lightning archive dropped onto the page.
// ---------------------------------------------------------------------------------------------
const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "html") e.innerHTML = v; else if (v !== undefined && v !== null) e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) e.append(kid.nodeType ? kid : String(kid));
  return e;
};
async function inflate(bytes, format) {
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream(format));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function fromArchive(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let eocd = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error("Not a .lightning archive");
  let p = dv.getUint32(eocd + 16, true);
  const n = dv.getUint16(eocd + 10, true);
  for (let i = 0; i < n; i++) {
    const method = dv.getUint16(p + 10, true), size = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true), extra = dv.getUint16(p + 30, true), comment = dv.getUint16(p + 32, true);
    const local = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nameLen));
    if (name === "profile.json") {
      const start = local + 30 + dv.getUint16(local + 26, true) + dv.getUint16(local + 28, true);
      const raw = u8.subarray(start, start + size);
      const data = method === 0 ? raw : await inflate(raw, "deflate-raw");
      return JSON.parse(new TextDecoder().decode(data));
    }
    p += 46 + nameLen + extra + comment;
  }
  throw new Error("profile.json not found in archive");
}
async function load() {
  const text = $("#lightning-data").textContent.trim();
  if (text && !text.startsWith("__")) {
    try {
      const bytes = Uint8Array.from(atob(text), c => c.charCodeAt(0));
      const json = new TextDecoder().decode(await inflate(bytes, "gzip"));
      return start(JSON.parse(json));
    } catch (e) { $("#drop").textContent = "Could not read the embedded capture: " + e.message; return; }
  }
  const drop = $("#drop");
  drop.innerHTML = "";
  drop.append(h("p", {}, "Drop a ", h("b", {}, ".lightning"), " file here, or "),
    h("input", { type: "file", accept: ".lightning,.zip", onchange: e => openFile(e.target.files[0]) }));
}
async function openFile(file) {
  try { start(await fromArchive(await file.arrayBuffer())); } catch (e) { $("#drop").textContent = e.message; }
}
document.addEventListener("dragover", e => { e.preventDefault(); $("#drop")?.classList.add("hot"); });
document.addEventListener("drop", e => { e.preventDefault(); if (e.dataTransfer.files[0]) openFile(e.dataTransfer.files[0]); });

// ---------------------------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------------------------
let D; // profile
const fmtMs = us => { const ms = us / 1000; return ms >= 100 ? ms.toFixed(0) : ms >= 10 ? ms.toFixed(1) : ms >= 1 ? ms.toFixed(2) : ms.toFixed(3); };
const fmtN = n => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e4 ? (n / 1e3).toFixed(1) + "k" : String(Math.round(n * 100) / 100);
const fmtB = b => b >= 1 << 30 ? (b / (1 << 30)).toFixed(2) + " GB" : b >= 1 << 20 ? (b / (1 << 20)).toFixed(0) + " MB" : (b / 1024).toFixed(0) + " KB";
const fmtS = us => (us / 1e6).toFixed(us < 1e7 ? 2 : 1) + " s";
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const PALETTE = ["#3b82c4", "#d9822b", "#4caf7a", "#c44f6a", "#8a6fd1", "#2fa8a8", "#b8a032", "#7a8794", "#d16fb5", "#5b9e3c", "#c46a3b", "#4f6fd1"];
const hue = s => { let x = 0; for (const c of s) x = (x * 31 + c.charCodeAt(0)) | 0; return x; };
const ownerColor = o => !o ? "#8a939e" : o === "java" ? "#9aa3ad" : o === "minecraft" ? "#5f9e4f" : o === "neoforge" ? "#d08a2e" : o === "lightning" ? "#e0b000" : o === "library" ? "#a8a8b8" : `hsl(${Math.abs(hue(o)) % 360} 55% 55%)`;
const tip = $("#tip");
function showTip(e, text) { tip.textContent = text; tip.style.display = "block"; const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8); tip.style.left = x + "px"; tip.style.top = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8) + "px"; }
function hideTip() { tip.style.display = "none"; }
function canvas(el, height) {
  const c = el.tagName === "CANVAS" ? el : el.appendChild(h("canvas"));
  const dpr = devicePixelRatio || 1, w = c.clientWidth || c.parentElement.clientWidth;
  c.style.height = height + "px"; c.width = Math.round(w * dpr); c.height = Math.round(height * dpr);
  const g = c.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { c, g, w, h: height };
}
function onWidth(el, fn) {
  let last = -1;
  new ResizeObserver(entries => { const w = Math.round(entries[0].contentRect.width); if (w !== last) { if (last >= 0) fn(); last = w; } }).observe(el);
}
function sortable(table, rows, columns, render) {
  let key = columns.findIndex(c => c.sort === "desc"), dir = -1;
  if (key < 0) key = 1;
  const head = h("tr", {}, columns.map((c, i) => h("th", { title: c.title || "", onclick: () => { dir = key === i ? -dir : -1; key = i; draw(); } }, c.label)));
  const body = h("tbody");
  table.append(h("thead", {}, head), body);
  function draw() {
    const get = columns[key].value;
    rows.sort((a, b) => { const x = get(a), y = get(b); return (x < y ? -1 : x > y ? 1 : 0) * dir; });
    body.innerHTML = "";
    for (const r of rows.slice(0, 1000)) body.append(render(r));
  }
  draw();
}
function nameOf(i) { return i < 0 ? "(thread)" : D.names[i] ?? "?"; }

// ---------------------------------------------------------------------------------------------
// Model preparation
// ---------------------------------------------------------------------------------------------
function prepare() {
  for (const t of D.threads) {
    const tr = t.tree, n = tr.parent.length;
    tr.children = Array.from({ length: n }, () => []);
    tr.depth = new Int16Array(n);
    for (let i = 1; i < n; i++) { tr.children[tr.parent[i]].push(i); tr.depth[i] = tr.depth[tr.parent[i]] + 1; }
    tr.path = i => { const parts = []; for (let x = i; x > 0; x = tr.parent[x]) parts.push(nameOf(tr.name[x])); return parts.reverse().join(" › "); };
    if (t.ticks) {
      const k = t.ticks, valid = k.duration.filter(d => d >= 0).sort((a, b) => a - b);
      t.count = valid.length;
      t.pct = q => valid.length ? valid[Math.min(valid.length - 1, Math.ceil(q * valid.length) - 1)] : 0;
      t.mean = valid.reduce((a, b) => a + b, 0) / Math.max(1, valid.length);
    }
  }
  D.render = D.threads.find(t => t.role === "render");
  D.server = D.threads.find(t => t.role === "server");
  if (D.jvm && D.jvm.cpuTree) {
    const f = D.jvm.cpuTree, n = f.parent.length;
    f.children = Array.from({ length: n }, () => []);
    for (let i = 1; i < n; i++) f.children[f.parent[i]].push(i);
  }
  // Server work per tick = duration minus the idle wait.
  if (D.server && D.server.ticks) {
    const t = D.server, k = t.ticks, wait = t.tree.name.findIndex((nm, i) => i > 0 && t.tree.parent[i] === 0 && nameOf(nm) === "nextTickWait");
    t.work = k.duration.map((d, i) => {
      if (d < 0) return -1;
      let w = 0;
      for (let b = k.breakdownStart[i]; b < k.breakdownStart[i + 1]; b++) if (k.breakdownNode[b] === wait) w += k.breakdownUs[b];
      return d - w;
    });
    const valid = t.work.filter(x => x >= 0).sort((a, b) => a - b);
    t.workPct = q => valid.length ? valid[Math.min(valid.length - 1, Math.ceil(q * valid.length) - 1)] : 0;
    t.workMean = valid.reduce((a, b) => a + b, 0) / Math.max(1, valid.length);
  }
}

// ---------------------------------------------------------------------------------------------
// App shell
// ---------------------------------------------------------------------------------------------
let TABS = [["overview", "Overview"], ["loading", "Loading"], ["frames", "Frames & ticks"], ["sections", "Sections"], ["world", "World"], ["cpu", "JVM CPU"], ["memory", "Memory"], ["threads", "Threads & pauses"], ["logs", "Logs"], ["brief", "Brief"], ["capture", "Capture"]];
const built = {};
function start(data) {
  D = data;
  if (!D.loading) TABS = TABS.filter(t => t[0] !== "loading");
  prepare();
  const env = D.environment || {};
  $("#hdr").textContent = `${new Date(D.startedAt).toLocaleString()} · ${fmtS(D.durationUs)} · ${env.context || ""}`;
  document.title = "Lightning · " + D.id;
  const main = $("#main"); main.innerHTML = "";
  const nav = $("#nav"); nav.innerHTML = "";
  for (const [id, label] of TABS) {
    main.append(h("section", { class: "tab", id: "tab-" + id }));
    nav.append(h("button", { "data-tab": id, onclick: () => go(id) }, label));
  }
  go(location.hash.slice(1).split(":")[0] || "overview");
}
function go(id, arg) {
  if (!TABS.find(t => t[0] === id)) id = "overview";
  for (const b of $("#nav").children) b.classList.toggle("on", b.dataset.tab === id);
  for (const s of document.querySelectorAll("section.tab")) s.classList.toggle("on", s.id === "tab-" + id);
  const el = $("#tab-" + id);
  if (!built[id]) { built[id] = true; try { VIEWS[id](el, arg); } catch (e) { el.append(h("div", { class: "card" }, "This view failed: " + e.message)); console.error(e); } }
  else if (arg && VIEWS[id].focus) VIEWS[id].focus(arg);
  history.replaceState(null, "", "#" + id);
}
function follow(link) {
  if (!link) return;
  const [tab, arg] = link.split(/:(.*)/);
  const map = { spikes: "frames", allocations: "memory", jvm: "threads", threads: "threads" };
  go(map[tab] || tab, arg);
}

// ---------------------------------------------------------------------------------------------
// Views
// ---------------------------------------------------------------------------------------------
const VIEWS = {};

VIEWS.overview = el => {
  if (D.contenders && D.contenders.length) {
    el.append(h("h2", { style: "margin:4px 0 2px;font-size:20px" }, "Your biggest contenders"),
      h("div", { class: "lead" }, "What is costing your game the most in this recording, biggest first. Click through for the evidence; the tabs above have every detail."));
    const grid = h("div", { class: "contenders" });
    D.contenders.forEach((c, i) => grid.append(h("div", { class: "contender" },
      h("div", { class: "rank" }, "#" + (i + 1)),
      h("div", { class: "ct" }, c.title),
      h("div", { class: "cs" }, c.size),
      h("div", { class: "cw" }, c.why),
      h("div", { class: "ctry" }, h("b", {}, "Try: "), c.try),
      h("a", { onclick: () => follow(c.link) }, "Show me →"))));
    el.append(grid);
  } else {
    el.append(h("div", { class: "lead" }, "Nothing stood out as a big cost in this recording."));
  }
  el.append(h("h3", {}, "At a glance"));
  const kpis = h("div", { class: "kpis" });
  const add = (v, l, title) => kpis.append(h("div", { class: "kpi", title: title || "" }, h("div", { class: "v" }, v), h("div", { class: "l" }, l)));
  const r = D.render, s = D.server;
  if (r && r.count) {
    add((r.count / (D.durationUs / 1e6)).toFixed(0), "frames per second (mean)");
    add(fmtMs(r.pct(0.5)) + " ms", "median frame time");
    add(fmtMs(r.pct(0.99)) + " ms", "99th percentile frame", "1 in 100 frames is slower than this");
    const gpu = r.ticks.gpu.filter(x => x >= 0).sort((a, b) => a - b);
    if (gpu.length) add(fmtMs(gpu[Math.floor(gpu.length / 2)]) + " ms", "median GPU time per frame");
  }
  if (s && s.work) {
    add(fmtMs(s.workPct(0.5)) + " ms", "median server tick work", "Work per tick, excluding the wait for the next tick");
    add(fmtMs(s.workPct(0.95)) + " ms", "95th percentile tick", "Budget is 50 ms per tick at 20 TPS");
  }
  if (D.metrics && D.metrics.length) {
    const peak = Math.max(...D.metrics.map(m => m[1])), max = D.metrics[0][3];
    add(fmtB(peak), `peak heap of ${fmtB(max)}`);
  }
  if (D.jvm && D.jvm.allocationStalls && D.jvm.allocationStalls.length) add(fmtMs(D.jvm.allocationStalls.reduce((a, p) => a + p[1], 0)) + " ms", "allocation stalls");
  el.append(kpis);

  if (D.phases && D.phases.length) {
    const t = h("table");
    sortable(t, D.phases.slice(), [{ label: "Phase", value: r => r.from, sort: "desc" }, { label: "seconds", value: r => r.to - r.from }, { label: "FPS", value: r => r.fps }, { label: "frame p50 ms", value: r => r.frameP50 }, { label: "frame p99 ms", value: r => r.frameP99 }, { label: "tick p50 ms", value: r => r.tickP50 }, { label: "memory waits", value: r => r.stalls }, { label: "alloc MB/s", value: r => r.allocMBps }, { label: "in use MB", value: r => r.liveP50 }],
      r => h("tr", {}, h("td", { class: "name" }, r.label), h("td", {}, ((r.to - r.from) / 1e6).toFixed(0)), h("td", {}, r.fps.toFixed(0)), h("td", {}, fmtMs(r.frameP50)), h("td", {}, fmtMs(r.frameP99)), h("td", {}, fmtMs(r.tickP50)), h("td", {}, `${r.stalls} (${fmtMs(r.stallUs)} ms)`), h("td", {}, r.allocMBps.toFixed(0)), h("td", {}, (r.liveP50 / 1048576).toFixed(0))));

// Category per breakdown node: top-level sections, with "render" split into its children.
function categories(t) {

  const add = (node, label) => { if (!cats.has(node)) { cats.set(node, list.length); list.push(label); } };
  for (const c of tr.children[0]) {
    const top = nameOf(tr.name[c]);
    if ((top === "render" || top === "gameRenderer") && tr.children[c].length && t.role === "render") { for (const g of tr.children[c]) add(g, nameOf(tr.name[g])); add(c, top + " (own)"); }
    else if (nameOf(tr.name[c]) === "tick" && t.role === "server" && tr.children[c].length) { for (const g of tr.children[c]) add(g, "tick › " + nameOf(tr.name[g])); add(c, "tick (own)"); }
    else add(c, nameOf(tr.name[c]));

  // order by total time

  for (const [node, idx] of cats) totals[idx] += node === 0 ? 0 : tr.self[node] + (cats.has(tr.parent[node]) ? 0 : tr.total[node] - tr.self[node]);

}
function frameChart(container, t, height, onPick, opts = {}) {

  const holder = h("div"); container.append(holder);
  const legend = h("div", { class: "legend" }, cat.list.map((l, i) => h("span", {}, h("i", { style: `background:${cat.color(i)}` }), l)));
  const hasGpu = k.gpu.some(x => x >= 0);

  container.append(legend);
  let picked = -1;

    const duration = D.durationUs;
    const values = k.duration.filter(x => x >= 0).sort((a, b) => a - b);
    const cap = Math.max(values[Math.floor(values.length * 0.995)] || 1, values[Math.floor(values.length / 2)] * 3 || 1) * 1.1;

    for (let i = 0; i <= 4; i++) { const v = cap * i / 4, yy = y(v); g.beginPath(); g.moveTo(pad.l, yy); g.lineTo(w - pad.r, yy); g.stroke(); g.fillText(fmtMs(v), 4, yy + 4); }
    for (let i = 0; i <= 6; i++) { const x = pad.l + W * i / 6; g.fillText(fmtS(duration * i / 6), x - 12, height - 5); }

      if (w > 30) { g.fillStyle = node === 0 ? css("--ink") : "#fff"; const s = lbl.replace(/^.*\.(?=[^.]+\.[^.]+$)/, ""); g.fillText(s.slice(0, Math.floor(w / 6.3)), x + 3, d * rowH + 12); }
    }
    c.onmousemove = e => {
      const rect = c.getBoundingClientRect(), mx = e.clientX - rect.left, my = e.clientY - rect.top;
      const hit = rows.find(r => mx >= r[1] && mx < r[1] + r[2] && my >= r[3] * rowH && my < (r[3] + 1) * rowH);
      if (!hit) return hideTip();
      const node = hit[0];
      showTip(e, `${label(node)}\nowner: ${owner(node) || "—"}\n${f.total[node]} samples (${(100 * f.total[node] / Math.max(1, f.total[0])).toFixed(1)}%), own ${f.self[node]}`);
    };
    c.onmouseleave = hideTip;
    c.onclick = e => {
      const rect = c.getBoundingClientRect(), mx = e.clientX - rect.left, my = e.clientY - rect.top;
      const hit = rows.find(r => mx >= r[1] && mx < r[1] + r[2] && my >= r[3] * rowH && my < (r[3] + 1) * rowH);

  }

    r => h("tr", {}, h("td", { class: "name" }, r[0]), h("td", {}, r[1][1]), h("td", {}, r[1][0]), h("td", {}, (100 * r[1][0] / all).toFixed(1))));

VIEWS.memory = el => {
  const m = D.metrics || [], j = D.jvm || {};
  const card = h("div", { class: "card" }, h("h2", {}, "Heap over time"), h("div", { class: "hint" }, "Used heap (filled), still in use after clean-up (red line — the live set), committed (thin line) and maximum (dashed), once per second. Marks below: collections (grey), times the game waited for memory (red)."));
  el.append(card);
  if (m.length > 1) {
    const holder = h("div"); card.append(holder);
    const draw = () => {
      holder.innerHTML = "";
      const { g, w } = canvas(holder, 200), H = 170, pad = 44, W = w - pad - 8;
      const max = Math.max(...m.map(x => x[3] > 0 ? x[3] : x[2])) * 1.05, dur = D.durationUs;
      const X = t => pad + t / dur * W, Y = v => 6 + H - v / max * H;
      g.fillStyle = css("--panel"); g.fillRect(0, 0, w, 200);
      g.fillStyle = css("--muted"); g.font = "11px system-ui";
      for (let i = 0; i <= 4; i++) g.fillText(fmtB(max * i / 4), 2, Y(max * i / 4) + 4);
      g.fillStyle = css("--accent"); g.globalAlpha = .35; g.beginPath(); g.moveTo(X(m[0][0]), Y(0));
      for (const p of m) g.lineTo(X(p[0]), Y(p[1])); g.lineTo(X(m[m.length - 1][0]), Y(0)); g.fill(); g.globalAlpha = 1;
      g.strokeStyle = css("--ink"); g.lineWidth = 1; g.beginPath(); m.forEach((p, i) => i ? g.lineTo(X(p[0]), Y(p[2])) : g.moveTo(X(p[0]), Y(p[2]))); g.stroke();
      if (m.some(p => p[9] > 0)) { g.strokeStyle = css("--high"); g.lineWidth = 2; g.beginPath(); let st = false; for (const p of m) { if (!(p[9] > 0)) continue; if (!st) { g.moveTo(X(p[0]), Y(p[9])); st = true; } else g.lineTo(X(p[0]), Y(p[9])); } g.stroke(); g.strokeStyle = css("--ink"); g.lineWidth = 1; }
      if (m[0][3] > 0) { g.setLineDash([4, 4]); g.beginPath(); g.moveTo(pad, Y(m[0][3])); g.lineTo(w - 8, Y(m[0][3])); g.stroke(); g.setLineDash([]); }
      g.fillStyle = css("--muted"); for (const gc of j.gc || []) g.fillRect(X(gc[0]), H + 10, 1, 8);
      g.fillStyle = css("--high"); for (const s of j.allocationStalls || []) g.fillRect(X(s[0]), H + 20, 2, 8);
    };
    draw(); onWidth(card, draw);
  }

  if (gcs.length) {
    const pauses = gcs.reduce((a, g) => a + g[2], 0), longest = Math.max(...gcs.map(g => g[3]));
    card.append(h("p", {}, `${gcs.length} collections by ${j.youngCollector}/${j.oldCollector}; pauses ${fmtMs(pauses)} ms in total, longest ${fmtMs(longest)} ms.` +
      ((j.allocationStalls || []).length ? ` ${j.allocationStalls.length} allocation stalls totalling ${fmtMs(j.allocationStalls.reduce((a, s) => a + s[1], 0))} ms (threads waiting for memory).` : "")));
  }
  const secs = D.durationUs / 1e6;
  if (j.allocByMod && j.allocByMod.length) {
    const t = h("table"), total = Math.max(1, j.allocationBytesEstimate);
    sortable(t, j.allocByMod.slice(), [{ label: "Mod", value: r => r[0] }, { label: "MB/s", value: r => r[2], sort: "desc" }, { label: "share", value: r => r[2] }],
      r => h("tr", {}, h("td", { class: "name" }, r[0]), h("td", {}, (r[2] / (1 << 20) / secs).toFixed(1)), h("td", {}, (100 * r[2] / total).toFixed(1) + "%")));
    el.append(h("div", { class: "card" }, h("h2", {}, "New memory by mod"), h("div", { class: "hint" }, "Charged to the innermost add-on mod on the stack (else the game). Churn, not what stays in memory."), h("div", { class: "scroll" }, t)));
  }
  if (D.deepMemory) el.append(h("div", { class: "card" }, h("h2", {}, "Who holds memory"), h("div", { class: "hint" }, "From a heap dump after the capture: each object is charged to the nearest mod object keeping it alive; otherwise to the game or library object holding it."), h("pre", { class: "md" }, D.deepMemory)));
  if (D.heapSnapshot) {
    const hs = D.heapSnapshot, t1 = h("table"), t2 = h("table");
    sortable(t1, hs.owners.slice(), [{ label: "Owner", value: r => r[0] }, { label: "MB", value: r => r[1], sort: "desc" }, { label: "share", value: r => r[1] }, { label: "classes", value: r => r[3] }],
      r => h("tr", {}, h("td", { class: "name" }, r[0]), h("td", {}, (r[1] / 1048576).toFixed(1)), h("td", {}, (100 * r[1] / hs.totalBytes).toFixed(1) + "%"), h("td", {}, r[3])));
    sortable(t2, hs.classes.slice(), [{ label: "Class", value: r => r[0] }, { label: "owner", value: r => r[3] }, { label: "MB", value: r => r[2], sort: "desc" }, { label: "count", value: r => r[1] }],
      r => h("tr", {}, h("td", { class: "name" }, r[0]), h("td", {}, r[3]), h("td", {}, (r[2] / 1048576).toFixed(1)), h("td", {}, fmtN(r[1]))));
    el.append(h("div", { class: "row" },
      h("div", { class: "card" }, h("h2", {}, `What is held in memory (${(hs.totalBytes / 1048576).toFixed(0)} MB)`), h("div", { class: "hint" }, `Snapshot after a full clean-up at the end of the capture (paused the game ${fmtMs(hs.pauseUs)} ms). Plain arrays can belong to any mod.`), h("div", { class: "scroll" }, t1)),
      h("div", { class: "card" }, h("h2", {}, "Largest classes"), h("div", { class: "scroll" }, t2))));
  }
  if (j.allocByClass && j.allocByClass.length) {

      r => h("tr", {}, h("td", { class: "name" }, r[0]), h("td", {}, (100 * r[2] / total).toFixed(1) + "%"), h("td", {}, (r[2] / (1 << 20) / (D.durationUs / 1e6)).toFixed(1))));

      r => h("tr", {}, h("td", { class: "name" }, r[0]), h("td", {}, (100 * r[2] / total).toFixed(1) + "%")));
    row.append(h("div", { class: "card" }, h("h2", {}, "Allocated types"), h("div", { class: "hint" }, `Estimated ${(total / (1 << 20) / (D.durationUs / 1e6)).toFixed(0)} MB/s in total. Sampled and weighted by size: where memory is allocated, not what is kept.`), h("div", { class: "scroll" }, t1)),
      h("div", { class: "card" }, h("h2", {}, "Allocation sites"), h("div", { class: "hint" }, "Innermost frame outside the JDK and common libraries."), h("div", { class: "scroll" }, t2)));

VIEWS.threads = el => {
  const j = D.jvm || {};
  if (j.threadCpu && j.threadCpu.length) {
    const groups = new Map();
    for (const [name, group, avg, max] of j.threadCpu) { const g = groups.get(group) || [0, 0, 0]; g[0] += avg; g[1] = Math.max(g[1], max); g[2]++; groups.set(group, g); }
    const t1 = h("table");
    sortable(t1, [...groups], [{ label: "Thread group", value: r => r[0] }, { label: "threads", value: r => r[1][2] }, { label: "avg cores", value: r => r[1][0], sort: "desc" }, { label: "peak (one thread)", value: r => r[1][1] }],
      r => h("tr", {}, h("td", { class: "name" }, r[0]), h("td", {}, r[1][2]), h("td", {}, r[1][0].toFixed(2)), h("td", {}, r[1][1].toFixed(2))));
    el.append(h("div", { class: "card" }, h("h2", {}, "CPU by thread group"), h("div", { class: "hint" }, "From JFR, once per second. 1.00 = one full core."), h("div", { class: "scroll" }, t1)));
  }

    sortable(t, j.pools.slice(), [{ label: "Thread pool", value: r => r.name }, { label: "JVM samples", value: r => r.samples, sort: "desc" }, { label: "Mods running on it", value: r => r.owners[0]?.[1] || 0 }],
      r => h("tr", {}, h("td", { class: "name" }, r.name), h("td", {}, r.samples), h("td", { class: "name" }, r.owners.slice(0, 4).map(o => `${o[0]} ${(100 * o[1] / Math.max(1, r.samples)).toFixed(0)}%`).join(", "))));
    el.append(h("div", { class: "card" }, h("h2", {}, "Which mods run on each thread pool"), h("div", { class: "hint" }, "Pools are often shared: one mod's work can run on another mod's threads."), h("div", { class: "scroll" }, t)));
  }

    sortable(t, list.slice(), cols, r => h("tr", { title: r[5] || "" }, cols.map(c => h("td", { class: c.cls || "" }, c.show ? c.show(r) : c.value(r)))));
    el.append(h("div", { class: "card" }, h("h2", {}, title), h("div", { class: "hint" }, hint), h("div", { class: "scroll" }, t)));
  };
  pause("JVM-wide pauses", "Operations that stop all Java threads (over 1 ms). GC pauses are under Memory.", j.vmOperations,
    [{ label: "Operation", value: r => r[4], cls: "name" }, { label: "at", value: r => r[0], show: r => fmtS(r[0]) }, { label: "ms", value: r => r[1], sort: "desc", show: r => fmtMs(r[1]) }, { label: "kind", value: r => r[3] }, { label: "requested by", value: r => r[2] }]);
  pause("Blocking on game threads", "Render/server thread waits on locks (>5 ms) or parks (>10 ms). Hover a row for the stack.", j.blocking,
    [{ label: "Thread", value: r => r[2] }, { label: "kind", value: r => r[3] }, { label: "on", value: r => r[4], cls: "name" }, { label: "at", value: r => r[0], show: r => fmtS(r[0]) }, { label: "ms", value: r => r[1], sort: "desc", show: r => fmtMs(r[1]) }]);
  pause("File and network waits on game threads", "Reads and writes over 1 ms on the render or server thread (only when the capture recorded io). Hover a row for the stack.", j.ioOnGameThreads,
    [{ label: "Thread", value: r => r[2] }, { label: "kind", value: r => r[3] }, { label: "file / address", value: r => r[4], cls: "name" }, { label: "at", value: r => r[0], show: r => fmtS(r[0]) }, { label: "ms", value: r => r[1], sort: "desc", show: r => fmtMs(r[1]) }]);
  if (j.io && j.io.length) {

    sortable(t, j.io.slice(), [{ label: "Kind", value: r => r[0] }, { label: "file / address", value: r => r[1] }, { label: "count", value: r => r[2] }, { label: "total ms", value: r => r[3], sort: "desc" }, { label: "longest ms", value: r => r[4] }, { label: "on game threads ms", value: r => r[5] }],
      r => h("tr", {}, h("td", {}, r[0]), h("td", { class: "name" }, r[1]), h("td", {}, r[2]), h("td", {}, fmtMs(r[3])), h("td", {}, fmtMs(r[4])), h("td", {}, fmtMs(r[5]))));

      r => h("tr", {}, h("td", { class: "name" }, r[0]), h("td", {}, r[1]), h("td", {}, r[2]), h("td", {}, fmtMs(r[3]))));
    el.append(h("div", { class: "card" }, h("h2", {}, "Waiting by thread group"), h("div", { class: "hint" }, "Idle worker threads park a lot by design; this is context, not a problem by itself."), h("div", { class: "scroll" }, t)));

VIEWS.logs = el => {

  const card = h("div", { class: "card" }, h("h2", {}, "Warnings and errors"), h("div", { class: "hint" }, "Repeated messages are merged (numbers ignored when comparing)." + (L.dropped ? ` ${L.dropped} further distinct messages were not kept.` : "")));
  const t = h("table");

  const save = h("button", { class: "btn", onclick: () => { const a = h("a", { href: URL.createObjectURL(new Blob([md], { type: "text/markdown" })), download: `lightning-${D.id}-summary.md` }); a.click(); } }, "Save as .md");
  el.append(h("div", { class: "card" }, h("h2", {}, "Brief for an analyst"), h("div", { class: "hint" }, "Plain-text summary of this capture with its measurement basis, for pasting into a chat with a person or an AI model."), h("div", { class: "controls" }, copy, save), pre));

VIEWS.capture = el => {
  const env = D.environment || {}, cov = D.coverage || {}, ov = cov && D.overhead || {};
